name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    # run.sh installs validation/requirements-validation.txt and propagates failures.
    # Freshness is metadata-only here, not a live availability or gate-promotion check.
    - name: Validate specifications, direction, offline freshness, and Gate B traceability
      run: bash validation/run.sh
