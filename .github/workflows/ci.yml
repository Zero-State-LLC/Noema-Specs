name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    # run.sh installs validation/requirements-validation.txt and propagates failures.
    # Freshness is metadata-only here, not a live availability or gate-promotion check.
    - name: Validate specifications, direction, offline freshness, and Gate B traceability
      run: bash validation/run.sh
    - name: Validate any committed PSR-1 / STUDY promotion receipts (ADR-0009)
      run: python3 tools/check_psr1_readiness.py --dir evidence/psr1-study
    - name: Validate GC1-GC10 RFC proposal registry (ADR-0010)
      run: python3 tools/check_gc_proposals.py
    # The committed graft/ index must match validation/*.py. Pinned to the version that built it (#366).
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22.12'
    - name: Check the committed graft index is fresh
      # Explicit --dir: once .trail/ exists, auto-detection looks there and finds no committed map.
      run: npx -y @nanonets/graft@0.26.0 --dir graft build --check
