name: Spec Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation deps
        run: pip install -r validation/requirements-validation.txt
      - name: Run validator smoke tests
        run: python -m unittest discover -s validation -p 'test_*.py'
      - name: Run validate_all
        run: python validation/validate_all.py
      - name: Run direction validation
        run: python validation/validate_direction.py
      - name: Validate freshness contract offline
        run: python validation/validate_freshness.py --offline
