status_vocabulary:
  LIVE_HOSTED: deployed and acceptance-observed at noema.guru
  IMPLEMENTED_RUNTIME: implemented with runtime tests but not proven on the frozen production alpha
  IMPLEMENTED_OFFLINE: executable in the Python reference runtime but not hosted-equivalent
  SPEC_COMPLETE: normative behavior and conformance are settled; runtime delivery may lag
  ACTIVE_INTEGRATION: existing systems are being integrated into an end-to-end outcome
  NEXT: next authorized work after the active gate closes
  BLOCKED: cannot proceed until named prerequisites close
  DEFERRED: intentionally outside the active campaign
  SPECULATIVE: direction without implementation authority
  RETIRED: no longer a valid product path
