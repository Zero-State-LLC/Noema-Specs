evidence_commits:
  # Two different questions, previously collapsed into one field.
  # production_specs_baseline: the canonical Specs main commit this promotion
  #   was authored against. It is an evidence anchor, not a self-referential head.
  # production_implements_specs: the Specs commit the LIVE WORKER BUILD implements,
  #   derived as the Specs head at the instant the build was cut. Moves per publish.
  #   Mirrors Noema hosted_live.specs_git and must equal it.
  # They differ whenever Specs moves without a publish, which is the normal case.
  production_specs_baseline: 492ccc9
  production_implements_specs: 81ca8c1
  production_successor_runtime: 61234cc
  live_worker_version_id: c681fd71-608f-4e4d-9207-96f4439700a3
  advanced_worker_runtime: 61234cc
  lca1_delta_report: f6ce6d2
  lca1_integrated_acceptance: a6b7e4b
status_vocabulary:
  LIVE_HOSTED: deployed and acceptance-observed at noema.guru
  IMPLEMENTED_RUNTIME: implemented with runtime tests but not proven on the frozen production alpha
  IMPLEMENTED_OFFLINE: executable in the Python reference runtime but not hosted-equivalent
  SPEC_COMPLETE: normative behavior and conformance are settled; runtime delivery may lag
  ACTIVE_INTEGRATION: existing systems are being integrated into an end-to-end outcome
  NEXT: next authorized work after the active gate closes
  BLOCKED: cannot proceed until named prerequisites close
  DEFERRED: intentionally outside the active campaign
  SPECULATIVE: direction without implementation authority
  RETIRED: no longer a valid product path
